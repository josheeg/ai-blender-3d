[project]
name = "blender-ai"
version = "0.1.0"
description = "AI-to-Blender interface. Python 3.14, packaged with `uv` under `src/blender_ai/`."
readme = "README.md"
authors = [
    { name = "josheeg", email = "josheeg@gmail.com" }
]
requires-python = ">=3.14"
dependencies = ["pydantic"]

[project.scripts]
blender-ai = "blender_ai:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff", "mypy", "pyinstaller", "pytest"]

[tool.ruff]
line-length = 88

[tool.mypy]
python-version = "3.14"
disallow-untyped-defs = true
